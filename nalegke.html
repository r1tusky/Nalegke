<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Налегке — трекер долгов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDF0E5;
    --surface:#FBFBF4;
    --surface-alt:#DFE4D3;
    --text:#1C261D;
    --text-muted:#5D675A;
    --border:#D1DAC5;
    --ink:#182E20;
    --ink-surface:#24422D;
    --ink-text:#F3F1E2;
    --ink-text-muted:#B3C8B4;
    --gold:#E8A33D;
    --gold-strong:#D98F1F;
    --gold-tint:#F7E3B8;
    --success:#497058;
    --danger:#B85C3F;
    --shadow:rgba(15,38,23,0.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#142018;
      --surface:#16281B;
      --surface-alt:#26352A;
      --text:#EDEEDE;
      --text-muted:#A5B4A5;
      --border:#334637;
      --ink:#0E170E;
      --ink-surface:#192920;
      --ink-text:#F1EFE0;
      --ink-text-muted:#9AAE9D;
      --gold:#F2B705;
      --gold-strong:#F7CB3E;
      --gold-tint:#3C3212;
      --success:#80A892;
      --danger:#D9846A;
      --shadow:rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#142018;
    --surface:#16281B;
    --surface-alt:#26352A;
    --text:#EDEEDE;
    --text-muted:#A5B4A5;
    --border:#334637;
    --ink:#0E170E;
    --ink-surface:#192920;
    --ink-text:#F1EFE0;
    --ink-text-muted:#9AAE9D;
    --gold:#F2B705;
    --gold-strong:#F7CB3E;
    --gold-tint:#3C3212;
    --success:#80A892;
    --danger:#D9846A;
    --shadow:rgba(0,0,0,0.45);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #shell{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    position:relative;
    padding-bottom:84px;
  }

  /* ---- Hero / status ---- */
  .hero{
    background:var(--ink);
    color:var(--ink-text);
    padding:22px 20px 18px;
    border-radius:0 0 22px 22px;
  }
  .hero-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:800;
    font-size:1.15rem;
    letter-spacing:-0.01em;
  }
  .brand-mark{font-size:1.2rem;}
  .hero-metrics{
    display:flex;
    gap:14px;
    font-size:0.82rem;
    color:var(--ink-text-muted);
  }
  .hero-metrics b{
    color:var(--gold);
    font-weight:800;
    font-variant-numeric:tabular-nums;
  }
  .level-name{
    margin-top:14px;
    font-size:1.3rem;
    font-weight:700;
  }
  .level-sub{
    margin-top:2px;
    font-size:0.85rem;
    color:var(--ink-text-muted);
  }
  #journeySvg{
    width:100%;
    height:96px;
    margin-top:8px;
    display:block;
  }
  .path-bg{
    fill:none;
    stroke:rgba(150,205,196,0.32);
    stroke-width:3;
    stroke-linecap:round;
  }
  .path-fg{
    fill:none;
    stroke:var(--gold);
    stroke-width:3;
    stroke-linecap:round;
    transition:stroke-dashoffset 900ms cubic-bezier(.22,.9,.3,1);
  }
  .checkpoint{
    fill:var(--ink);
    stroke:rgba(255,255,255,0.35);
    stroke-width:2;
    r:4.5;
    transition:fill 500ms ease, stroke 500ms ease;
  }
  .checkpoint.reached{
    fill:var(--gold);
    stroke:var(--gold);
  }
  #marker{
    fill:var(--gold);
    stroke:var(--ink);
    stroke-width:2;
    r:6;
    transition:cx 900ms cubic-bezier(.22,.9,.3,1), cy 900ms cubic-bezier(.22,.9,.3,1);
  }

  /* ---- Tabs ---- */
  .tabbar{
    position:fixed;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    width:calc(100% - 32px);
    max-width:428px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    display:flex;
    box-shadow:0 8px 24px var(--shadow);
    overflow:hidden;
    z-index:20;
  }
  .tab-btn{
    flex:1;
    padding:12px 6px;
    border:none;
    background:none;
    font-family:inherit;
    font-size:0.78rem;
    font-weight:700;
    color:var(--text-muted);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
  }
  .tab-btn .ic{font-size:1.05rem;}
  .tab-btn.active{color:var(--gold-strong);}

  main{flex:1;padding:18px 20px 8px;}
  .tabpanel{display:none;}
  .tabpanel.active{display:block;animation:fadeIn 260ms ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  /* ---- Cards / lists ---- */
  .stat-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    box-shadow:0 6px 18px var(--shadow);
    margin-top:-34px;
    position:relative;
    z-index:5;
  }
  .stat-row{display:flex;justify-content:space-between;gap:12px;}
  .stat{flex:1;}
  .stat .num{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;}
  .stat .lbl{font-size:0.78rem;color:var(--text-muted);margin-top:2px;}
  .stat.paid .num{color:var(--success);}
  .stat.left .num{color:var(--text);}
  .progress-track{
    margin-top:14px;
    height:8px;
    border-radius:6px;
    background:var(--surface-alt);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--gold-strong),var(--gold));
    border-radius:6px;
    transition:width 700ms ease;
  }

  .section-title{
    font-size:1rem;
    font-weight:700;
    margin:22px 0 10px;
  }

  .action-row{display:flex;gap:10px;margin-top:16px;}
  .btn{
    font-family:inherit;
    font-weight:700;
    font-size:0.9rem;
    border-radius:12px;
    border:none;
    padding:12px 14px;
    cursor:pointer;
  }
  .btn-primary{background:var(--gold);color:var(--ink);flex:1;}
  .btn-primary:active{background:var(--gold-strong);}
  .btn-ghost{background:var(--surface-alt);color:var(--text);}
  .btn-text{background:none;color:var(--text-muted);text-decoration:underline;padding:8px 2px;font-size:0.85rem;}

  .payment-item, .debt-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 2px;
    border-bottom:1px solid var(--border);
    gap:10px;
  }
  .payment-item:last-child, .debt-row:last-child{border-bottom:none;}
  .payment-item .who{font-weight:600;font-size:0.92rem;}
  .payment-item .when{font-size:0.78rem;color:var(--text-muted);}
  .payment-item .amt{font-weight:800;color:var(--success);font-variant-numeric:tabular-nums;}

  .debt-row{flex-direction:column;align-items:stretch;padding:14px 2px;}
  .debt-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .debt-name{font-weight:700;font-size:0.98rem;}
  .debt-type{
    display:inline-block;
    font-size:0.7rem;
    font-weight:700;
    color:var(--text-muted);
    background:var(--surface-alt);
    border-radius:20px;
    padding:2px 9px;
    margin-top:4px;
  }
  .debt-balance{font-weight:800;font-size:1.02rem;font-variant-numeric:tabular-nums;}
  .debt-meta{font-size:0.76rem;color:var(--text-muted);margin-top:2px;}
  .mini-track{height:6px;border-radius:5px;background:var(--surface-alt);margin-top:10px;overflow:hidden;}
  .mini-fill{height:100%;background:var(--gold);border-radius:5px;transition:width 700ms ease;}
  .debt-actions{display:flex;gap:8px;margin-top:10px;}
  .debt-actions .btn{padding:9px 12px;font-size:0.82rem;}
  .icon-btn{
    background:none;border:none;color:var(--text-muted);
    font-size:0.95rem;cursor:pointer;padding:4px 6px;
  }
  .confirm-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:0.85rem;color:var(--text-muted);}

  .empty{
    text-align:center;
    padding:30px 10px;
    color:var(--text-muted);
  }
  .empty .big{font-size:2rem;margin-bottom:8px;}
  .empty p{font-size:0.9rem;line-height:1.5;margin:0 0 14px;}

  /* ---- Badges ---- */
  .badge-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:6px;
  }
  .badge-tile{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 8px;
    text-align:center;
  }
  .badge-tile .bi{font-size:1.5rem;filter:grayscale(1);opacity:0.35;}
  .badge-tile.unlocked{background:var(--gold-tint);border-color:var(--gold);}
  .badge-tile.unlocked .bi{filter:none;opacity:1;}
  .badge-tile .bn{font-size:0.72rem;font-weight:700;margin-top:6px;line-height:1.25;}
  .badge-tile.unlocked .bn{color:var(--gold-strong);}

  /* ---- Modals ---- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(10,11,20,0.45);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--surface);
    width:100%;
    max-width:460px;
    border-radius:20px 20px 0 0;
    padding:20px 20px 26px;
    max-height:82vh;
    overflow-y:auto;
  }
  .sheet h3{margin:0 0 14px;font-size:1.05rem;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:0.8rem;font-weight:700;color:var(--text-muted);margin-bottom:5px;}
  .field input, .field select{
    width:100%;
    font-family:inherit;
    font-size:0.95rem;
    padding:11px 12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .sheet-actions{display:flex;gap:10px;margin-top:16px;}
  .sheet-actions .btn{flex:1;}
  textarea#shareText{
    width:100%;min-height:110px;font-family:inherit;font-size:0.88rem;
    padding:12px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);resize:none;
  }

  /* ---- Toast ---- */
  #toastWrap{
    position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
    width:calc(100% - 32px);max-width:428px;
    display:flex;flex-direction:column;gap:8px;
    z-index:60;pointer-events:none;
  }
  .toast{
    background:var(--ink);color:var(--ink-text);
    border-radius:12px;padding:12px 14px;
    font-size:0.85rem;font-weight:600;
    box-shadow:0 8px 20px var(--shadow);
    animation:toastIn 260ms ease, toastOut 260ms ease 3.2s forwards;
  }
  .toast b{color:var(--gold);}
  @keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  @keyframes toastOut{to{opacity:0;transform:translateY(-6px);}}

  @media (max-width:360px){
    .stat .num{font-size:1.3rem;}
  }
</style>
</head>
<body>
<div id="shell">

  <div class="hero">
    <div class="hero-top">
      <div class="brand"><span class="brand-mark">🪶</span>Налегке</div>
      <div class="hero-metrics">
        <span>🔥 <b id="streakVal">0</b> мес</span>
        <span>🥾 <b id="milesVal">0</b> миль</span>
      </div>
    </div>
    <div class="level-name" id="levelName">Точка старта</div>
    <div class="level-sub" id="levelSub">Добавь первый долг — и путь начнётся</div>
    <svg id="journeySvg" viewBox="0 0 320 96" preserveAspectRatio="none">
      <path class="path-bg" d="M10,80 Q80,86 100,50 T190,40 T310,12"></path>
      <path class="path-fg" id="pathFg" d="M10,80 Q80,86 100,50 T190,40 T310,12"></path>
      <circle class="checkpoint" data-pct="0" cx="10" cy="80" r="4.5"></circle>
      <circle class="checkpoint" data-pct="25"></circle>
      <circle class="checkpoint" data-pct="50"></circle>
      <circle class="checkpoint" data-pct="75"></circle>
      <circle class="checkpoint" data-pct="100"></circle>
      <circle id="marker" cx="10" cy="80" r="6"></circle>
    </svg>
  </div>

  <main>
    <!-- Dashboard -->
    <section class="tabpanel active" id="panel-dash">
      <div class="stat-card">
        <div class="stat-row">
          <div class="stat left"><div class="num" id="statLeft">0 ₽</div><div class="lbl">Осталось выплатить</div></div>
          <div class="stat paid"><div class="num" id="statPaid">0 ₽</div><div class="lbl">Уже погашено</div></div>
        </div>
        <div class="progress-track"><div class="progress-fill" id="statProgressFill" style="width:0%"></div></div>
        <div class="action-row">
          <button class="btn btn-primary" id="btnQuickPay">Внести платёж</button>
          <button class="btn btn-ghost" id="btnShare">Поделиться</button>
        </div>
      </div>

      <div class="section-title">Последние платежи</div>
      <div id="recentList"></div>
    </section>

    <!-- Debts -->
    <section class="tabpanel" id="panel-debts">
      <div class="section-title" style="margin-top:6px;">Мои долги</div>
      <div id="debtsList"></div>
      <button class="btn btn-ghost" style="width:100%;margin-top:14px;" id="btnAddDebt">+ Добавить долг</button>
    </section>

    <!-- Badges -->
    <section class="tabpanel" id="panel-badges">
      <div class="section-title" style="margin-top:6px;">Находки</div>
      <div class="badge-grid" id="badgeGrid"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab-btn active" data-tab="dash"><span class="ic">🧭</span>Тропа</button>
    <button class="tab-btn" data-tab="debts"><span class="ic">🎒</span>Долги</button>
    <button class="tab-btn" data-tab="badges"><span class="ic">🍃</span>Находки</button>
  </nav>

  <div id="toastWrap"></div>

  <!-- Add debt sheet -->
  <div class="overlay" id="addDebtOverlay">
    <div class="sheet">
      <h3>Новый долг</h3>
      <div class="field"><label>Название</label><input id="fDebtName" placeholder="Например, кредитка Тинькофф"></div>
      <div class="field"><label>Тип</label>
        <select id="fDebtType">
          <option>Кредит</option>
          <option>Кредитная карта</option>
          <option>Рассрочка</option>
          <option>Другое</option>
        </select>
      </div>
      <div class="field"><label>Сумма долга сейчас, ₽</label><input id="fDebtAmount" type="number" min="0" placeholder="150000"></div>
      <div class="field"><label>Мин. платёж, ₽ (необязательно)</label><input id="fDebtMin" type="number" min="0" placeholder="5000"></div>
      <div class="field"><label>Ставка, % (необязательно)</label><input id="fDebtRate" type="number" min="0" step="0.1" placeholder="19.9"></div>
      <div class="sheet-actions">
        <button class="btn btn-ghost" id="cancelAddDebt">Отмена</button>
        <button class="btn btn-primary" id="confirmAddDebt">Добавить</button>
      </div>
    </div>
  </div>

  <!-- Payment sheet -->
  <div class="overlay" id="payOverlay">
    <div class="sheet">
      <h3>Внести платёж</h3>
      <div class="field"><label>Долг</label><select id="fPayDebt"></select></div>
      <div class="field"><label>Сумма, ₽</label><input id="fPayAmount" type="number" min="0" placeholder="5000"></div>
      <div class="field"><label>Дата</label><input id="fPayDate" type="date"></div>
      <div class="sheet-actions">
        <button class="btn btn-ghost" id="cancelPay">Отмена</button>
        <button class="btn btn-primary" id="confirmPay">Записать платёж</button>
      </div>
    </div>
  </div>

  <!-- Share sheet -->
  <div class="overlay" id="shareOverlay">
    <div class="sheet">
      <h3>Поделиться прогрессом</h3>
      <p style="font-size:0.85rem;color:var(--text-muted);margin-top:-6px;">Суммы не попадают в текст — только процент и серия.</p>
      <textarea id="shareText" readonly></textarea>
      <div class="sheet-actions">
        <button class="btn btn-ghost" id="closeShare">Закрыть</button>
        <button class="btn btn-primary" id="copyShare">Скопировать</button>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "nalegke_state_v1";
  var quotes = [
    "Каждый платёж — это шаг, который уже не отменить.",
    "Долг молчит, когда ты действуешь.",
    "Свобода строится по одному платежу за раз.",
    "Не обязательно спешить — просто не останавливайся.",
    "Сегодняшний платёж — это письмо будущему себе.",
    "Маленький шаг сегодня — меньше тревоги завтра.",
    "Ты сильнее, чем твой самый крупный долг.",
    "Прогресс редко бывает быстрым. Но он твой."
  ];

  var badgeDefs = [
    {id:"first_payment", icon:"🥾", name:"Первый шаг", check:function(s){return s.payments.length>=1;}},
    {id:"five_payments", icon:"🎒", name:"Пять платежей", check:function(s){return s.payments.length>=5;}},
    {id:"streak3", icon:"🔥", name:"Три месяца подряд", check:function(s){return currentStreak(s)>=3;}},
    {id:"streak6", icon:"🔥", name:"Полгода в пути", check:function(s){return currentStreak(s)>=6;}},
    {id:"p25", icon:"🌄", name:"Первые шаги (25%)", check:function(s){return progressPct(s)>=25;}},
    {id:"p50", icon:"🏞️", name:"Полпути позади", check:function(s){return progressPct(s)>=50;}},
    {id:"p75", icon:"🌅", name:"Почти у цели", check:function(s){return progressPct(s)>=75;}},
    {id:"debt_closed", icon:"✅", name:"Долг закрыт", check:function(s){return s.debts.some(function(d){return d.original>0 && d.balance<=0;});}},
    {id:"p100", icon:"🪶", name:"Налегке!", check:function(s){return s.debts.length>0 && progressPct(s)>=100;}}
  ];

  function defaultState(){
    return {debts:[], payments:[], miles:0, badges:[]};
  }

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if(!parsed || !Array.isArray(parsed.debts)) return defaultState();
      return Object.assign(defaultState(), parsed);
    }catch(e){
      return defaultState();
    }
  }

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ /* storage unavailable, continue in-memory */ }
  }

  var state = load();

  function fmt(n){
    n = Math.round(n||0);
    return n.toLocaleString('ru-RU') + " ₽";
  }

  function totalOriginal(){ return state.debts.reduce(function(a,d){return a+d.original;},0); }
  function totalBalance(){ return state.debts.reduce(function(a,d){return a+Math.max(d.balance,0);},0); }
  function progressPct(s){
    s = s||state;
    var orig = s.debts.reduce(function(a,d){return a+d.original;},0);
    if(orig<=0) return 0;
    var bal = s.debts.reduce(function(a,d){return a+Math.max(d.balance,0);},0);
    var pct = ((orig-bal)/orig)*100;
    return Math.max(0, Math.min(100, pct));
  }

  function monthKey(dateStr){ return dateStr.slice(0,7); }

  function currentStreak(s){
    s = s||state;
    if(s.payments.length===0) return 0;
    var months = {};
    s.payments.forEach(function(p){ months[monthKey(p.date)] = true; });
    var dates = Object.keys(months).sort();
    var lastMonth = dates[dates.length-1];
    var d = new Date(lastMonth + "-01T00:00:00");
    var streak = 0;
    while(true){
      var key = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
      if(months[key]){
        streak++;
        d.setMonth(d.getMonth()-1);
      } else { break; }
    }
    return streak;
  }

  function levelInfo(pct){
    if(pct>=100) return {name:"Налегке!", sub:"Все долги закрыты — вот это путь."};
    if(pct>=75) return {name:"Почти у цели", sub:"Финальный отрезок — ты почти налегке."};
    if(pct>=50) return {name:"Полпути позади", sub:"Больше половины пути пройдено."};
    if(pct>=25) return {name:"В пути", sub:"Движение уже заметно."};
    if(pct>0) return {name:"Первые шаги", sub:"Главное — начать."};
    return {name:"Точка старта", sub: state.debts.length? "Первый платёж запустит путь." : "Добавь первый долг — и путь начнётся"};
  }

  /* ---------- SVG journey ---------- */
  var pathFg = document.getElementById("pathFg");
  var pathLen = pathFg.getTotalLength();
  pathFg.style.strokeDasharray = pathLen;
  var marker = document.getElementById("marker");
  var checkpoints = Array.prototype.slice.call(document.querySelectorAll(".checkpoint"));

  checkpoints.forEach(function(cp){
    var pct = parseFloat(cp.getAttribute("data-pct"));
    var pt = pathFg.getPointAtLength((pct/100)*pathLen);
    cp.setAttribute("cx", pt.x);
    cp.setAttribute("cy", pt.y);
  });

  function renderJourney(){
    var pct = progressPct();
    pathFg.style.strokeDashoffset = pathLen - (pathLen*pct/100);
    var pt = pathFg.getPointAtLength((pct/100)*pathLen);
    marker.setAttribute("cx", pt.x);
    marker.setAttribute("cy", pt.y);
    checkpoints.forEach(function(cp){
      var cpct = parseFloat(cp.getAttribute("data-pct"));
      cp.classList.toggle("reached", pct>=cpct);
    });
    var lvl = levelInfo(pct);
    document.getElementById("levelName").textContent = lvl.name;
    document.getElementById("levelSub").textContent = lvl.sub;
    document.getElementById("streakVal").textContent = currentStreak();
    document.getElementById("milesVal").textContent = state.miles;
  }

  /* ---------- Dashboard ---------- */
  function renderDashboard(){
    document.getElementById("statLeft").textContent = fmt(totalBalance());
    document.getElementById("statPaid").textContent = fmt(totalOriginal()-totalBalance());
    document.getElementById("statProgressFill").style.width = progressPct()+"%";

    var list = document.getElementById("recentList");
    var recent = state.payments.slice().sort(function(a,b){return b.date.localeCompare(a.date);}).slice(0,6);
    if(recent.length===0){
      list.innerHTML = '<div class="empty"><div class="big">🥾</div><p>Платежей пока нет. Внеси первый — и появится история пути.</p></div>';
      return;
    }
    list.innerHTML = recent.map(function(p){
      var debt = state.debts.find(function(d){return d.id===p.debtId;});
      var name = debt? debt.name : "Долг удалён";
      return '<div class="payment-item"><div><div class="who">'+escapeHtml(name)+'</div><div class="when">'+p.date+'</div></div><div class="amt">+'+fmt(p.amount)+'</div></div>';
    }).join("");
  }

  /* ---------- Debts tab ---------- */
  var confirmDeleteId = null;

  function renderDebts(){
    var wrap = document.getElementById("debtsList");
    if(state.debts.length===0){
      wrap.innerHTML = '<div class="empty"><div class="big">🎒</div><p>Пока здесь пусто. Добавь свой первый долг — и начнём путь налегке.</p></div>';
      return;
    }
    wrap.innerHTML = state.debts.map(function(d){
      var pct = d.original>0 ? Math.min(100, Math.max(0,(d.original-Math.max(d.balance,0))/d.original*100)) : 0;
      var metaBits = [];
      if(d.minPayment) metaBits.push("Мин. платёж: "+fmt(d.minPayment));
      if(d.rate) metaBits.push(d.rate+"%");
      var confirming = confirmDeleteId===d.id;
      return ''+
        '<div class="debt-row">'+
          '<div class="debt-top">'+
            '<div><div class="debt-name">'+escapeHtml(d.name)+'</div><span class="debt-type">'+escapeHtml(d.type)+'</span></div>'+
            '<div style="text-align:right;"><div class="debt-balance">'+fmt(Math.max(d.balance,0))+'</div>'+
            '<button class="icon-btn" data-del="'+d.id+'" aria-label="Удалить">✕</button></div>'+
          '</div>'+
          (metaBits.length? '<div class="debt-meta">'+metaBits.join(" • ")+'</div>':'')+
          '<div class="mini-track"><div class="mini-fill" style="width:'+pct.toFixed(0)+'%"></div></div>'+
          (confirming?
            '<div class="confirm-row">Удалить «'+escapeHtml(d.name)+'»? <button class="btn btn-ghost" data-confirmdel="'+d.id+'" style="padding:6px 10px;">Да</button><button class="btn-text" data-canceldel="1">Нет</button></div>'
            :
            '<div class="debt-actions"><button class="btn btn-primary" data-pay="'+d.id+'">Внести платёж</button></div>'
          )+
        '</div>';
    }).join("");
  }

  /* ---------- Badges tab ---------- */
  function renderBadges(){
    var grid = document.getElementById("badgeGrid");
    grid.innerHTML = badgeDefs.map(function(b){
      var unlocked = state.badges.indexOf(b.id)!==-1;
      return '<div class="badge-tile'+(unlocked?' unlocked':'')+'"><div class="bi">'+b.icon+'</div><div class="bn">'+b.name+'</div></div>';
    }).join("");
  }

  function renderAll(){
    renderJourney();
    renderDashboard();
    renderDebts();
    renderBadges();
  }

  /* ---------- Badge checking ---------- */
  function checkNewBadges(){
    var fresh = [];
    badgeDefs.forEach(function(b){
      if(state.badges.indexOf(b.id)===-1 && b.check(state)){
        state.badges.push(b.id);
        fresh.push(b);
      }
    });
    return fresh;
  }

  /* ---------- Toast ---------- */
  function toast(html){
    var wrap = document.getElementById("toastWrap");
    var el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = html;
    wrap.appendChild(el);
    setTimeout(function(){ el.remove(); }, 3500);
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ---------- Tabs ---------- */
  document.querySelectorAll(".tab-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.querySelectorAll(".tab-btn").forEach(function(b){b.classList.remove("active");});
      document.querySelectorAll(".tabpanel").forEach(function(p){p.classList.remove("active");});
      btn.classList.add("active");
      document.getElementById("panel-"+btn.getAttribute("data-tab")).classList.add("active");
    });
  });

  /* ---------- Add debt ---------- */
  var addDebtOverlay = document.getElementById("addDebtOverlay");
  document.getElementById("btnAddDebt").addEventListener("click", function(){
    document.getElementById("fDebtName").value="";
    document.getElementById("fDebtAmount").value="";
    document.getElementById("fDebtMin").value="";
    document.getElementById("fDebtRate").value="";
    addDebtOverlay.classList.add("open");
  });
  document.getElementById("cancelAddDebt").addEventListener("click", function(){ addDebtOverlay.classList.remove("open"); });
  document.getElementById("confirmAddDebt").addEventListener("click", function(){
    var name = document.getElementById("fDebtName").value.trim();
    var amount = parseFloat(document.getElementById("fDebtAmount").value);
    if(!name || !(amount>0)){ toast("Укажи название и сумму долга"); return; }
    var debt = {
      id: "d"+Date.now(),
      name: name,
      type: document.getElementById("fDebtType").value,
      original: amount,
      balance: amount,
      minPayment: parseFloat(document.getElementById("fDebtMin").value)||0,
      rate: parseFloat(document.getElementById("fDebtRate").value)||0,
      createdAt: new Date().toISOString().slice(0,10)
    };
    state.debts.push(debt);
    save();
    addDebtOverlay.classList.remove("open");
    renderAll();
  });

  /* ---------- Delete debt ---------- */
  document.getElementById("debtsList").addEventListener("click", function(e){
    var delId = e.target.getAttribute("data-del");
    var confirmId = e.target.getAttribute("data-confirmdel");
    var cancel = e.target.getAttribute("data-canceldel");
    var payId = e.target.getAttribute("data-pay");
    if(delId){ confirmDeleteId = delId; renderDebts(); }
    else if(confirmId){
      state.debts = state.debts.filter(function(d){return d.id!==confirmId;});
      confirmDeleteId = null;
      save(); renderAll();
    }
    else if(cancel){ confirmDeleteId = null; renderDebts(); }
    else if(payId){ openPay(payId); }
  });

  /* ---------- Payment ---------- */
  var payOverlay = document.getElementById("payOverlay");
  function openPay(preselectId){
    var sel = document.getElementById("fPayDebt");
    sel.innerHTML = state.debts.map(function(d){return '<option value="'+d.id+'">'+escapeHtml(d.name)+'</option>';}).join("");
    if(preselectId) sel.value = preselectId;
    document.getElementById("fPayAmount").value = "";
    document.getElementById("fPayDate").value = new Date().toISOString().slice(0,10);
    if(state.debts.length===0){ toast("Сначала добавь долг во вкладке «Долги»"); return; }
    payOverlay.classList.add("open");
  }
  document.getElementById("btnQuickPay").addEventListener("click", function(){ openPay(null); });
  document.getElementById("cancelPay").addEventListener("click", function(){ payOverlay.classList.remove("open"); });
  document.getElementById("confirmPay").addEventListener("click", function(){
    var debtId = document.getElementById("fPayDebt").value;
    var amount = parseFloat(document.getElementById("fPayAmount").value);
    var date = document.getElementById("fPayDate").value || new Date().toISOString().slice(0,10);
    var debt = state.debts.find(function(d){return d.id===debtId;});
    if(!debt || !(amount>0)){ toast("Укажи сумму платежа"); return; }

    var wasOpen = debt.balance>0;
    debt.balance = Math.max(0, debt.balance-amount);
    state.payments.push({id:"p"+Date.now(), debtId:debtId, amount:amount, date:date});
    state.miles += 10;
    if(wasOpen && debt.balance<=0) state.miles += 50;

    var newBadges = checkNewBadges();
    save();
    payOverlay.classList.remove("open");
    renderAll();

    var quote = quotes[Math.floor(Math.random()*quotes.length)];
    toast(quote);
    newBadges.forEach(function(b, i){
      setTimeout(function(){ toast("🎉 Новая находка: <b>"+b.name+"</b>"); }, 500+i*700);
    });
  });

  /* ---------- Share ---------- */
  var shareOverlay = document.getElementById("shareOverlay");
  document.getElementById("btnShare").addEventListener("click", function(){
    var lvl = levelInfo(progressPct());
    var txt = "Иду налегке 🪶\nУровень: "+lvl.name+"\nПрогресс: "+Math.round(progressPct())+"%\nСерия: "+currentStreak()+" мес подряд 🔥\n\nТоже начинаю разбираться с долгами — присоединяйся.";
    document.getElementById("shareText").value = txt;
    shareOverlay.classList.add("open");
  });
  document.getElementById("closeShare").addEventListener("click", function(){ shareOverlay.classList.remove("open"); });
  document.getElementById("copyShare").addEventListener("click", function(){
    var ta = document.getElementById("shareText");
    ta.select();
    try{
      navigator.clipboard.writeText(ta.value).then(function(){ toast("Скопировано — можно отправить друзьям"); });
    }catch(e){
      toast("Не скопировалось автоматически — текст выделен, скопируй вручную");
    }
  });

  /* close overlays on backdrop click */
  [addDebtOverlay, payOverlay, shareOverlay].forEach(function(ov){
    ov.addEventListener("click", function(e){ if(e.target===ov) ov.classList.remove("open"); });
  });

  renderAll();
})();
</script>
</body>
</html>
